<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<title>Unit 3 — walkthrough</title>
<style>
  html, body { margin: 0; height: 100%; background: #c5d4e0; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif; color: #2c2824;
  }
  #room {
    position: absolute; top: 18px; left: 20px;
    background: rgba(255,252,247,0.88); padding: 8px 12px; border-radius: 8px;
    letter-spacing: 0.01em;
  }
  #room b { display: block; font-size: 16px; font-weight: 650; }
  #room span { color: #6d655c; font-size: 12px; }
  #hint {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(255,252,247,0.9); padding: 8px 14px; border-radius: 999px;
    white-space: nowrap;
  }
  #cross {
    position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px;
    border: 1.5px solid rgba(255,255,255,0.85); border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
  }
  #topBar {
    pointer-events: none; position: absolute; top: 14px; right: 14px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: min(520px, calc(100vw - 28px));
  }
  #topBar .actions {
    pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
  }
  #topBar button {
    border: 0; cursor: pointer; border-radius: 8px; padding: 10px 14px;
    font: 600 14px/1 "Segoe UI", system-ui, sans-serif; white-space: nowrap;
  }
  #viewBtn { background: #2c2824; color: #f7f3ec; }
  #viewBtn:hover { background: #453e36; }
  #vrBtn { background: #6b2a32; color: #f7f3ec; }
  #vrBtn:hover { background: #8a3640; }
  #muteBtn { background: rgba(255,252,247,0.92); color: #2c2824; }
  #muteBtn:hover { background: #efe8de; }
  #muteBtn.on { background: #2c2824; color: #f7f3ec; }
  #movePad {
    display: none; pointer-events: auto; position: absolute; left: 16px; bottom: 96px;
    width: 118px; height: 118px; border-radius: 50%;
    background: rgba(255,252,247,0.32); border: 2px solid rgba(44,40,36,0.28);
    touch-action: none; z-index: 5;
  }
  #movePad .knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px;
    border-radius: 50%; background: rgba(44,40,36,0.55);
  }
  #lookHint {
    display: none; pointer-events: none; position: absolute; right: 16px; bottom: 108px;
    background: rgba(255,252,247,0.88); color: #2c2824; border-radius: 999px;
    padding: 8px 12px; font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
    max-width: 42vw; text-align: center;
  }
  #styles {
    pointer-events: auto; display: flex; flex-direction: column; gap: 6px; align-items: stretch;
  }
  #styles button {
    border: 0; cursor: pointer; border-radius: 8px; padding: 8px 12px;
    background: rgba(255,252,247,0.92); color: #2c2824;
    font: 600 13px/1 "Segoe UI", system-ui, sans-serif; text-align: right;
  }
  #styles button.on { background: #2c2824; color: #f7f3ec; }
  #day {
    pointer-events: auto; position: absolute; left: 50%; bottom: 58px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    width: min(460px, calc(100vw - 36px));
    background: rgba(255,252,247,0.92); color: #2c2824;
    border-radius: 999px; padding: 8px 14px;
    font: 600 13px/1 "Segoe UI", system-ui, sans-serif;
  }
  #day input { flex: 1; accent-color: #8a5a32; min-width: 0; }
  #timeName { min-width: 76px; text-align: right; }
  @media (hover: none) and (pointer: coarse) {
    #movePad, #lookHint { display: block; }
    #room {
      top: 12px; left: 12px; right: 12px; max-width: none;
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    }
    #room b { display: inline; font-size: 15px; }
    #room span { font-size: 11px; }
    #topBar {
      left: 12px; right: 12px; top: 56px; max-width: none;
      align-items: stretch;
    }
    #topBar .actions { justify-content: stretch; width: 100%; }
    #topBar .actions button { flex: 1 1 0; padding: 10px 8px; font-size: 12px; text-align: center; }
    #styles {
      width: 100%; flex-direction: row; flex-wrap: nowrap; gap: 6px;
    }
    #styles button { flex: 1 1 0; text-align: center; padding: 8px 6px; font-size: 11px; }
    #day {
      bottom: 48px; width: calc(100vw - 24px); left: 12px; transform: none;
      padding: 8px 12px; font-size: 12px; gap: 8px;
    }
    #timeName { min-width: 64px; }
    #hint {
      bottom: 10px; font-size: 12px; max-width: calc(100vw - 24px);
      white-space: normal; text-align: center; line-height: 1.35;
    }
    #movePad { bottom: 112px; left: 12px; }
    #lookHint { bottom: 124px; right: 12px; }
  }
  body.vr-on #hud #day, body.vr-on #hud #styles, body.vr-on #hud #viewBtn, body.vr-on #hud #cross,
  body.vr-on #movePad, body.vr-on #lookHint, body.vr-on #muteBtn, body.vr-on #topBar .actions #muteBtn,
  body.vr-on #topBar .actions #viewBtn { display: none; }
  body.vr-on #hint {
    display: block; bottom: 28px; white-space: normal; max-width: 86vw; text-align: center;
  }
  #err {
    display: none; position: fixed; inset: 0; padding: 32px;
    background: #f6f1e8; color: #2c2824; font: 16px/1.5 system-ui, sans-serif;
  }
</style>

<body>
<div id="hud">
  <div id="room"><b>Living</b><span>13'-0" × 17'-0"</span></div>
  <div id="hint">WASD to walk · doors open as you approach · click a door to hold it</div>
  <div id="day">
    <span>Morning</span>
    <input id="time" type="range" min="0" max="100" value="18" />
    <span id="timeName">Morning</span>
  </div>
  <div id="cross"></div>
  <div id="topBar">
    <div class="actions">
      <button id="muteBtn" type="button">Mute</button>
      <button id="vrBtn" type="button">Enter VR</button>
      <button id="viewBtn" type="button">Dollhouse view</button>
    </div>
    <div id="styles">
      <button type="button" data-style="modern">Modern Indian</button>
      <button type="button" data-style="scandi">Traditional</button>
      <button type="button" data-style="luxury">Palace</button>
    </div>
  </div>
  <div id="movePad" aria-label="Move"><div class="knob"></div></div>
  <div id="lookHint">Swipe to turn · joystick to walk</div>
</div>
<div id="err"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const errEl = document.getElementById("err");
if (!window.THREE) {
  errEl.style.display = "block";
  errEl.textContent = "Three.js did not load. This page needs a network connection to unpkg.com.";
  throw new Error("THREE missing");
}

const T = 0.5;
const EX = 0.7;
const H = 10;
const DOOR_H = 7;
const SILL = 2.55;
const HEAD = 7.2;
const EYE = 5.4; // adult eye height (~5'8" person)
const VR_EYE = 4.75; // slightly below desktop eye — phone VR felt tall at 5.4
const RADIUS = 0.42;

const liveW = 13, liveD = 17;
const ntoiW = 5.5, ntoiD = 8;
const cbW = 12, cbD = 12;
const midW = 5.5;
const neW = 10 + 10 / 12, neD = 12;
const balW = 6, balD = 20;
const masW = 13 + 11 / 12, masD = 19 + 4 / 12;
const drW = 5 + 5 / 12, drD = 6;
const mtD = 8;
const sbW = 12, sbD = 12;
const stW = 5, stD = 8;
const kW = 10 + 5 / 12, kD = 12;
const uD = 11.5;

const box = (x0, x1, z0, z1) => ({ x0, x1, z0, z1 });
const living = box(0, liveW, 0, liveD);
const nwtoi = box(living.x1 + T, living.x1 + T + ntoiW, 0, ntoiD);
const cbed = box(nwtoi.x1 + T, nwtoi.x1 + T + cbW, 0, cbD);
const alcove = box(nwtoi.x0, cbed.x0, ntoiD + T, cbD);
const midtoi = box(cbed.x1 + T, cbed.x1 + T + midW, 0, ntoiD);
const nebed = box(midtoi.x1 + T, midtoi.x1 + T + neW, 0, neD);
const east = nebed.x1;
const balcony = box(east + T, east + T + balW, 0, balD);
const lobby = box(midtoi.x0, midtoi.x1, ntoiD + T, cbD + T);
const master = box(0, masW, liveD + T, liveD + T + masD);
const south = master.z1;
const kitchen = box(east - kW, east, south - kD, south);
const stoi = box(kitchen.x0 - T - stW, kitchen.x0 - T, south - stD, south);
const sbed = box(stoi.x0 - T - sbW, stoi.x0 - T, south - sbD, south);
const dress = box(master.x1 + T, master.x1 + T + drW, 0, 0);
{
  const bay = masD - mtD - drD - T - T;
  dress.z0 = master.z0 + bay + T;
  dress.z1 = dress.z0 + drD;
}
const mtoi = box(dress.x0, dress.x1, dress.z1 + T, dress.z1 + T + mtD);
const utility = box(balcony.x0, balcony.x1, south - uD, south);
const passage = box(stoi.x0, stoi.x1, sbed.z0, stoi.z0 - T);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xc5d4e0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
if ("useLegacyLights" in renderer) renderer.useLegacyLights = true;
renderer.xr.enabled = true;
if (renderer.xr.setReferenceSpaceType) renderer.xr.setReferenceSpaceType("local-floor");
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const rig = new THREE.Group();
const xrHead = new THREE.Group();
xrHead.position.y = VR_EYE;
rig.add(xrHead);
scene.add(rig);
scene.fog = new THREE.Fog(0xc5d4e0, 70, 140);

const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.08, 240);
camera.rotation.order = "YXZ";
scene.add(camera);

const hemi = new THREE.HemisphereLight(0xf4efe4, 0xd9cbb8, 0.38);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0xfff4e4, 0.28);
fill.position.set(-20, 24, 40);
scene.add(fill);
const sun = new THREE.DirectionalLight(0xfff3df, 2.15);
sun.position.set(52, 36, -18);
sun.target.position.set(24, 0, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 140;
sun.shadow.camera.left = -48;
sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48;
sun.shadow.camera.bottom = -48;
sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.035;
scene.add(sun);
scene.add(sun.target);

const ceilings = new THREE.Group();
const labels = new THREE.Group();
labels.visible = false;
scene.add(ceilings);
scene.add(labels);

const solids = [];
const doors = [];
const doorMeshes = [];
const curtains = [];
const curtainMeshes = [];
function clothPanel(width, drop) {
  const geo = new THREE.PlaneGeometry(width, drop, 4, 12);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const nx = x / (width * 0.5);
    const ny = y / drop + 0.5;
    const bow = Math.cos(nx * Math.PI * 0.5) * 0.11 * (0.25 + 0.75 * (1 - ny));
    const hem = (1 - ny) * (1 - ny) * 0.05;
    pos.setZ(i, bow + hem);
    pos.setX(i, x * (1 + (1 - ny) * 0.22));
  }
  geo.computeVertexNormals();
  return geo;
}
function poseCurtain(c) {
  const t = c.amount;
  const n = c.strips.length;
  const span = c.a1 - c.a0;
  const bunch = Math.min(0.7, span * 0.18);
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n;
    const side = u < 0.5 ? -1 : 1;
    const k = u < 0.5 ? u / 0.5 : (1 - u) / 0.5;
    const closedA = c.a0 + u * span;
    const openA = side < 0 ? c.a0 + 0.06 + k * bunch : c.a1 - 0.06 - k * bunch;
    const a = closedA + (openA - closedA) * t;
    const pleat = (i % 2 === 0 ? 1 : -1);
    const fold = pleat * (0.42 + 0.85 * t);
    const billow = (0.04 + 0.05 * Math.sin(i * 1.7)) * (1 - t) + 0.16 * t * (0.3 + k);
    const face = c.into < 0 ? Math.PI : 0;
    const m = c.strips[i];
    m.position.y = c.y - (1 - t) * 0.02 * (i % 3);
    if (c.alongX) {
      m.position.x = a;
      m.position.z = c.fixed + c.into * billow;
      m.rotation.y = face + fold;
    } else {
      m.position.z = a;
      m.position.x = c.fixed + c.into * billow;
      m.rotation.y = Math.PI / 2 + face + fold;
    }
  }
}
function windowCurtains(a0, a1, fixed, sill, head, into, alongX, room, when) {
  const y0 = sill > 3.05 ? sill - 0.12 : 0.02;
  const drop = Math.max(1.2, head - y0 + 0.15);
  const span = a1 - a0;
  const n = Math.max(10, Math.round(span * 1.35));
  const sw = (span / n) * 1.85;
  const strips = [];
  const geo = clothPanel(sw, drop);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo, mat.cloth);
    m.castShadow = false;
    m.receiveShadow = true;
    scene.add(m);
    strips.push(m);
    curtainMeshes.push(m);
  }
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, span + 0.35, 8), mat.bronze);
  if (alongX) {
    rod.rotation.z = Math.PI / 2;
    rod.position.set((a0 + a1) / 2, head + 0.08, fixed);
  } else {
    rod.rotation.x = Math.PI / 2;
    rod.position.set(fixed, head + 0.08, (a0 + a1) / 2);
  }
  scene.add(rod);
  const c = { strips, amount: 0, target: 0, a0, a1, fixed, into, alongX, y: y0 + drop / 2, room: room || null, when: when || null, latchedClosed: false };
  strips.forEach((m) => { m.userData.curtain = c; });
  curtains.push(c);
  poseCurtain(c);
}

function srgb(tex) {
  if ("colorSpace" in tex) tex.colorSpace = THREE.SRGBColorSpace;
  else tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return srgb(t);
}
function noise(ctx, w, h, alpha) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * alpha;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}
function woodTex(colors) {
  return canvasTex(512, 512, (g, w, h) => {
    const rows = 7;
    const ph = h / rows;
    for (let i = 0; i < rows; i++) {
      g.fillStyle = colors[i % colors.length];
      g.fillRect(0, i * ph, w, ph - 3);
      g.strokeStyle = "rgba(50,30,12,0.28)";
      g.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        let y = i * ph + 6 + k * (ph / 7);
        g.beginPath();
        g.moveTo(0, y);
        for (let x = 0; x <= w; x += 36) {
          y += (Math.sin(i * 3 + k + x * 0.02) * 2.2);
          g.lineTo(x, y);
        }
        g.stroke();
      }
      g.fillStyle = "rgba(70,40,16,0.28)";
      g.beginPath();
      g.ellipse(70 + (i * 67) % 380, i * ph + ph * 0.45, 9, 5, 0.5, 0, Math.PI * 2);
      g.fill();
    }
    noise(g, w, h, 12);
  });
}
function stoneTex(colors) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = colors[0];
    g.fillRect(0, 0, w, h);
    g.strokeStyle = colors[1];
    g.lineCap = "round";
    g.lineJoin = "round";
    for (let i = 0; i < 16; i++) {
      g.globalAlpha = i % 3 === 0 ? 0.62 : 0.28;
      g.lineWidth = i % 5 === 0 ? 2.4 : 0.7;
      g.beginPath();
      let x = -20;
      let y = (i * 31) % h;
      g.moveTo(x, y);
      while (x < w + 30) {
        x += 28 + (i % 4) * 10;
        y += Math.sin(i * 1.7 + x * 0.015) * 14;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    noise(g, w, h, 7);
  });
}
function curtainTex(hex, gold) {
  return canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = hex;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,0.08)";
    g.lineWidth = 1;
    for (let y = 0; y < h; y += 5) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.strokeStyle = gold;
    g.globalAlpha = 0.55;
    g.lineWidth = 3;
    for (const y of [18, h - 22]) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.globalAlpha = 1;
    noise(g, w, h, 14);
  });
}
function veneerTex(base, dark) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = dark;
    for (let i = 0; i < 90; i++) {
      g.globalAlpha = 0.05 + (i % 5) * 0.022;
      g.lineWidth = 1 + (i % 3);
      let x = (i * 53) % w;
      g.beginPath();
      g.moveTo(x, 0);
      for (let y = 0; y <= h; y += 32) {
        x += Math.sin(i * 1.3 + y * 0.011) * 2.4;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    noise(g, w, h, 9);
  });
}
function fabricTex(hex) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = hex;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,0.14)";
    g.lineWidth = 1;
    for (let y = 0; y < h; y += 4) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.strokeStyle = "rgba(0,0,0,0.06)";
    for (let x = 0; x < w; x += 4) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    noise(g, w, h, 16);
  });
}
function tileTex(colors) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = colors[0];
    g.fillRect(0, 0, w, h);
    g.strokeStyle = colors[1];
    g.lineWidth = 8;
    g.strokeRect(5, 5, w - 10, h - 10);
    noise(g, w, h, 8);
  });
}
function deckTex(colors) {
  return canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = colors[0];
    g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 26) {
      g.strokeStyle = x % 52 ? colors[1] : "rgba(255,255,255,0.18)";
      g.beginPath();
      g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
    }
    noise(g, w, h, 10);
  });
}
function rugTex(colors) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = colors[0];
    g.fillRect(0, 0, w, h);
    g.strokeStyle = colors[1];
    g.lineWidth = 34;
    g.strokeRect(12, 12, w - 24, h - 24);
    g.lineWidth = 5;
    g.strokeRect(54, 54, w - 108, h - 108);
    g.beginPath();
    g.arc(w / 2, h / 2, 78, 0, Math.PI * 2);
    g.stroke();
    g.beginPath();
    g.arc(w / 2, h / 2, 26, 0, Math.PI * 2);
    g.stroke();
    g.globalAlpha = 0.55;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      g.beginPath();
      g.moveTo(w / 2 + Math.cos(a) * 30, h / 2 + Math.sin(a) * 30);
      g.lineTo(w / 2 + Math.cos(a) * 92, h / 2 + Math.sin(a) * 92);
      g.stroke();
    }
    g.globalAlpha = 1;
  });
}
function galleryArt(g, kind, colors, rnd) {
  const TAU = Math.PI * 2;
  g.fillStyle = "#fbf8f2";
  g.fillRect(0, 0, 256, 320);
  g.fillStyle = colors[0];
  g.fillRect(30, 30, 196, 260);
  g.lineCap = "round";
  if (kind === 1) {
    g.fillStyle = colors[1];
    g.fillRect(52, 62, 96, 128);
    g.fillStyle = colors[2];
    g.beginPath(); g.arc(150, 190, 52, 0, TAU); g.fill();
    g.fillStyle = colors[3];
    g.fillRect(96, 222, 108, 40);
    g.strokeStyle = colors[1];

// A run of flat handleless cabinet fronts. `face` is the open side: "+x", "-x", "+z" or "-z".
function cabinetRun(o) {
  const { x0, x1, z0, z1, y0, y1, face } = o;
  addBox(x1 - x0, y1 - y0, z1 - z0, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, o.mat);
  const alongZ = face[1] === "x";
  const dir = face[0] === "+" ? 1 : -1;
  const a0 = alongZ ? z0 : x0;
  const a1 = alongZ ? z1 : x1;
  const n = Math.max(1, Math.round((a1 - a0) / (o.module || 2)));
  const step = (a1 - a0) / n;
  const f = (alongZ ? (dir > 0 ? x1 : x0) : (dir > 0 ? z1 : z0)) + dir * 0.004;
  const h = y1 - y0;
  const line = (p0, p1, ya, yb) => {
    if (alongZ) addBox(0.012, yb - ya, p1 - p0, f, (ya + yb) / 2, (p0 + p1) / 2, mat.gap, { cast: false });
    else addBox(p1 - p0, yb - ya, 0.012, (p0 + p1) / 2, (ya + yb) / 2, f, mat.gap, { cast: false });
  };
  for (let i = 1; i < n; i++) line(a0 + i * step - 0.01, a0 + i * step + 0.01, y0 + 0.01, y1 - 0.01);
  for (const i of o.drawers || []) {
    if (i >= n) continue;
    for (const c of o.cuts || [0.5]) {
      line(a0 + i * step + 0.01, a0 + (i + 1) * step - 0.01, y0 + h * c - 0.01, y0 + h * c + 0.01);
    }
  }
  if (o.gola === "top") line(a0, a1, y1 - 0.11, y1 - 0.01);
  if (o.gola === "bottom") line(a0, a1, y0 + 0.01, y0 + 0.08);
}
